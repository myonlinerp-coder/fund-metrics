name: Run fund metrics
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fund_metrics.py
      - uses: actions/upload-artifact@v4
        with:
          name: fund-metrics-csv
          path: fund_metrics.csv
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add fund_metrics.csv
          git commit -m "Update fund metrics" || echo "no changes"
          git push
